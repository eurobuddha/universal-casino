<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Casino</title>
<script type="text/javascript" src="mds.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap');
:root{
  --bg:#f5f0e8;--bg-card:#fff;--bg-hover:#faf7f2;
  --border:#e0d8c8;--border-focus:#b8a88a;
  --text:#2c2418;--text-dim:#8a7e6a;--text-bright:#1a1008;
  --accent:#c8553a;--accent-light:#f4ddd7;--accent-dark:#a33d26;
  --green:#2d7a4f;--green-bg:#e4f2ea;--green-light:#3a9963;
  --red:#c8553a;--red-bg:#fceae5;
  --gold:#b8860b;--gold-bg:#fdf6e3;--gold-border:#d4a843;
  --warn:#b8860b;--warn-bg:#fdf6e3;
  --sans:'Manrope',system-ui,sans-serif;--display:'Playfair Display',Georgia,serif;
  --mono:'SF Mono','Menlo',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
.shell{max-width:480px;margin:0 auto;padding:12px 16px 40px}

/* Header */
.hdr{text-align:center;padding:20px 0 16px;border-bottom:2px solid var(--border);margin-bottom:4px}
.hdr__title{font-family:var(--display);font-size:22px;color:var(--text-bright);letter-spacing:-.5px}
.hdr__sub{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-top:2px;font-weight:600}
.hdr__meta{display:flex;justify-content:center;gap:16px;margin-top:10px}
.hdr__wallet{font-size:13px;font-weight:800;background:var(--green-bg);border:1px solid var(--green);padding:4px 12px;border-radius:var(--radius);color:var(--green)}
.hdr__status{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);font-weight:600}
.hdr__dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Tabs */
.tabs{display:flex;gap:2px;margin:12px 0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:3px}
.tab{flex:1;background:none;border:none;color:var(--text-dim);font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 6px;cursor:pointer;border-radius:6px;transition:all .15s}
.tab:hover{color:var(--text);background:var(--bg-hover)}
.tab--active{background:var(--text-bright);color:#fff;box-shadow:var(--shadow)}

/* Views */
.view{display:none;padding:10px 0}.view--active{display:block}
.view__title{font-family:var(--display);font-size:17px;margin-bottom:8px;color:var(--text-bright)}

/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .2s}
.card:hover{border-color:var(--border-focus)}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.info{font-size:13px;color:var(--text-dim)}.info b{color:var(--text);font-weight:600}
.stat{font-size:16px;font-weight:800;color:var(--gold)}

/* Badges */
.badge{display:inline-block;padding:2px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;border-radius:4px}
.badge--flip{background:#e8f4fd;color:#2e7db5}.badge--dice{background:var(--gold-bg);color:var(--gold)}.badge--roulette{background:var(--accent-light);color:var(--accent)}
.badge--open{background:var(--green-bg);color:var(--green)}.badge--taken{background:var(--warn-bg);color:var(--warn)}.badge--reveal{background:var(--accent-light);color:var(--accent)}

/* Buttons */
.btn{display:inline-block;font-family:var(--sans);font-size:13px;font-weight:700;padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--bg-card);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn--gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn--gold:hover{background:var(--gold-border);box-shadow:var(--shadow-lg)}
.btn--green{background:var(--green);color:#fff;border-color:var(--green)}.btn--green:hover{background:var(--green-light);box-shadow:var(--shadow-lg)}
.btn--red{background:var(--accent);color:#fff;border-color:var(--accent)}.btn--red:hover{background:var(--accent-dark)}
.btn--full{width:100%;margin-top:10px;padding:10px}.btn--sm{padding:5px 10px;font-size:12px}
.btn--disabled{opacity:.4;pointer-events:none}.btn--ghost{background:transparent;color:var(--text-dim)}.btn--ghost:hover{color:var(--accent);border-color:var(--accent)}

/* Fields */
.field{display:block;margin-bottom:12px}
.field__label{display:block;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field__input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--sans);font-size:16px;padding:10px 12px;outline:none;transition:border-color .2s;color:var(--text)}
.field__input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}

/* Presets */
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.preset{padding:10px;text-align:center;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;font-weight:600;transition:all .15s;background:var(--bg-card);color:var(--text-dim)}
.preset:hover{border-color:var(--accent);color:var(--text)}.preset:active{transform:translateY(1px)}
.preset--active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow)}
.preset__name{font-weight:700}.preset__desc{font-size:11px;opacity:.7;margin-top:1px}

/* Picks */
.picks{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.pick{min-width:38px;padding:6px 10px;text-align:center;cursor:pointer;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;transition:all .12s;background:var(--bg-card);color:var(--text-dim)}
.pick:hover{border-color:var(--green);color:var(--text)}.pick:active{transform:translateY(1px)}
.pick--active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:var(--shadow)}

/* Status */
.bet-status{margin-top:8px;font-size:13px;font-weight:600;min-height:0;padding:0;border-radius:var(--radius);transition:all .2s}
.bet-status:not(:empty){padding:8px 10px;margin-top:8px}
.bet-status--ok{background:var(--green-bg);color:var(--green)}.bet-status--err{background:var(--red-bg);color:var(--red)}.bet-status--warn{background:var(--warn-bg);color:var(--warn)}
.status{margin-top:10px;font-size:13px;font-weight:600;min-height:18px;padding:4px 0}
.status--ok{color:var(--green)}.status--err{color:var(--red)}.status--warn{color:var(--warn)}
.empty{padding:24px;text-align:center;color:var(--text-dim);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius)}
.summary{padding:10px 12px;background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--gold)}
.divider{height:1px;background:var(--border);margin:8px 0}

/* Coin flip animation */
.coin-scene{perspective:600px;display:flex;justify-content:center;align-items:center;padding:16px 0 8px}
.coin-box{width:64px;height:64px;position:relative;transform-style:preserve-3d}
.coin-box--spin{animation:coinSpin 1.8s cubic-bezier(.4,0,.2,1) infinite}
@keyframes coinSpin{0%{transform:rotateY(0)}100%{transform:rotateY(1080deg)}}
.coin-f,.coin-b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;backface-visibility:hidden;border-radius:50%;border:3px solid}
.coin-f{background:linear-gradient(145deg,#f0d060,#c8a830);border-color:#d4a843;color:#5a4000}
.coin-b{background:linear-gradient(145deg,#c8a830,#8a7200);border-color:#a08020;color:#f0d060;transform:rotateY(180deg)}

/* Dice roll animation */
.dice-scene{perspective:800px;display:flex;justify-content:center;align-items:center;padding:16px 0 8px}
.dice-box{width:56px;height:56px;position:relative;transform-style:preserve-3d}
.dice-box--roll{animation:diceRoll 2s cubic-bezier(.3,0,.2,1) infinite}
@keyframes diceRoll{0%{transform:rotateX(0) rotateY(0)}25%{transform:rotateX(270deg) rotateY(180deg)}50%{transform:rotateX(540deg) rotateY(90deg)}75%{transform:rotateX(810deg) rotateY(360deg)}100%{transform:rotateX(1080deg) rotateY(720deg)}}
.dice-face{position:absolute;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;backface-visibility:hidden;background:var(--bg-card);border:2px solid var(--border);border-radius:6px;color:var(--text)}
.df1{transform:translateZ(28px)}.df2{transform:rotateY(90deg) translateZ(28px)}.df3{transform:rotateY(180deg) translateZ(28px)}
.df4{transform:rotateY(-90deg) translateZ(28px)}.df5{transform:rotateX(90deg) translateZ(28px)}.df6{transform:rotateX(-90deg) translateZ(28px)}

/* Roulette spin animation */
.rl-scene{display:flex;justify-content:center;align-items:center;padding:16px 0 8px}
.rl-wheel{width:72px;height:72px;position:relative;border:3px solid var(--accent);border-radius:50%;overflow:hidden;box-shadow:var(--shadow-lg)}
.rl-wheel--spin{animation:rlSpin 2.5s cubic-bezier(.2,0,.1,1) infinite}
@keyframes rlSpin{0%{transform:rotate(0)}100%{transform:rotate(1080deg)}}
.rl-inner{position:absolute;inset:0;background:conic-gradient(var(--accent) 0deg,var(--bg) 10deg,var(--green) 20deg,var(--bg) 30deg,var(--accent) 40deg,var(--bg) 50deg,var(--green) 60deg,var(--bg) 70deg,var(--accent) 80deg,var(--bg) 90deg,var(--green) 100deg,var(--bg) 110deg,var(--accent) 120deg,var(--bg) 130deg,var(--green) 140deg,var(--bg) 150deg,var(--accent) 160deg,var(--bg) 170deg,var(--green) 180deg,var(--bg) 190deg,var(--accent) 200deg,var(--bg) 210deg,var(--green) 220deg,var(--bg) 230deg,var(--accent) 240deg,var(--bg) 250deg,var(--green) 260deg,var(--bg) 270deg,var(--accent) 280deg,var(--bg) 290deg,var(--green) 300deg,var(--bg) 310deg,var(--accent) 320deg,var(--bg) 330deg,var(--green) 340deg,var(--bg) 350deg,var(--accent) 360deg)}
.rl-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:var(--bg-card);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--gold);z-index:1}

/* Result modal */
.result-overlay{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.result-inner{text-align:center;background:var(--bg-card);border-radius:16px;padding:36px 44px 28px;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,.8,.3,1) forwards;min-width:280px;max-width:360px}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.result-icon{font-size:48px;margin-bottom:8px}
.result-title{font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:4px}
.result-detail{font-size:13px;color:var(--text-dim);margin:6px 0}
.result-amount{font-size:18px;font-weight:800;margin:10px 0}
.result-dismiss{margin-top:14px;padding:8px 28px;font-family:var(--sans);font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer}
.result-dismiss:hover{background:var(--bg-hover);border-color:var(--border-focus)}

/* History row */
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}

/* Activity log */
.log{max-height:120px;overflow-y:auto;font-size:12px;font-family:var(--mono);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin:8px 0}
.log:empty{display:none}
.log-entry{padding:4px 8px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:baseline}
.log-entry:last-child{border-bottom:none}
.log-time{color:var(--text-dim);font-size:10px;white-space:nowrap}
.log-msg{flex:1;word-break:break-word}
.log--ok{color:var(--green)}.log--warn{color:var(--warn)}.log--err{color:var(--red)}.log--info{color:var(--text-dim)}
</style>
</head>
<body>
<div class="shell">

  <header class="hdr">
    <span class="hdr__title">Universal Casino</span>
    <span class="hdr__sub">Fair Odds On-Chain</span>
    <div class="hdr__meta">
      <span class="hdr__wallet" id="balanceDisplay">&mdash; Minima</span>
      <div class="hdr__status"><span class="hdr__dot"></span><span id="blockHeight">&mdash;</span></div>
    </div>
  </header>

  <div class="log" id="activityLog"></div>

  <nav class="tabs">
    <button class="tab tab--active" data-view="play">Play</button>
    <button class="tab" data-view="house">Be House</button>
    <button class="tab" data-view="mybets">My Bets</button>
    <button class="tab" data-view="history">History</button>
  </nav>

  <section id="view-play" class="view view--active">
    <h2 class="view__title">Open Bets</h2>
    <div id="openBets"><div class="empty">No open bets</div></div>
  </section>

  <section id="view-house" class="view">
    <h2 class="view__title">Create a Bet</h2>
    <div class="presets" id="presetBar">
      <div class="preset preset--active" data-preset="flip" onclick="selectPreset('flip')"><div class="preset__name">Coin Flip</div><div class="preset__desc">1:1</div></div>
      <div class="preset" data-preset="dice" onclick="selectPreset('dice')"><div class="preset__name">Dice</div><div class="preset__desc">5:1</div></div>
      <div class="preset" data-preset="roulette" onclick="selectPreset('roulette')"><div class="preset__name">Roulette</div><div class="preset__desc">35:1</div></div>
    </div>
    <label class="field">
      <span class="field__label">Bet Amount (what player stakes)</span>
      <input type="number" id="betAmountInput" class="field__input" value="1" min="0.01" step="0.01" oninput="updateSummary()">
    </label>
    <div class="summary" id="houseSummary"></div>
    <button class="btn btn--gold btn--full" id="btnCreate" onclick="createBet()">Create Bet</button>
    <div id="createStatus" class="status"></div>
  </section>

  <section id="view-mybets" class="view">
    <h2 class="view__title">My Bets</h2>
    <div id="myBetsList"><div class="empty">No active bets</div></div>
  </section>

  <section id="view-history" class="view">
    <h2 class="view__title">History</h2>
    <div id="historyList"><div class="empty">No completed bets yet</div></div>
  </section>

</div>

<div class="result-overlay" id="resultFlash">
  <div class="result-inner" id="resultFlashInner"></div>
</div>

<script>
/* ============================================
   UNIVERSAL CASINO LINT v1.3.2
   3-phase commit-reveal: create > take > reveal > resolve
   Fair odds — neither party can compute outcome early
   ============================================ */

var SCRIPT='LET hpk=PREVSTATE(0) LET ha=PREVSTATE(1) LET hc=PREVSTATE(2) LET rng=PREVSTATE(3) LET po=PREVSTATE(4) LET bt=PREVSTATE(5) LET ph=PREVSTATE(6) LET to=PREVSTATE(7) IF ph EQ 0 AND SIGNEDBY(hpk) THEN RETURN TRUE ENDIF IF ph EQ 0 THEN ASSERT SAMESTATE(0 5) ASSERT STATE(6) EQ 1 ASSERT STATE(7) EQ to ASSERT STATE(11) GTE 0 AND STATE(11) LT rng ASSERT VERIFYOUT(@INPUT @ADDRESS @AMOUNT+bt @TOKENID TRUE) RETURN TRUE ENDIF LET qk=PREVSTATE(8) LET pk=PREVSTATE(11) IF ph EQ 1 AND SIGNEDBY(hpk) THEN ASSERT SAMESTATE(0 5) ASSERT STATE(6) EQ 2 ASSERT SAMESTATE(7 11) LET hs=STATE(12) ASSERT SHA3(hs) EQ hc ASSERT VERIFYOUT(@INPUT @ADDRESS @AMOUNT @TOKENID TRUE) RETURN TRUE ENDIF IF ph EQ 1 AND @COINAGE GT to AND SIGNEDBY(qk) THEN RETURN TRUE ENDIF IF ph EQ 2 AND SIGNEDBY(qk) THEN LET ps=STATE(13) ASSERT SHA3(ps) EQ PREVSTATE(10) LET hs=PREVSTATE(12) LET h=SHA3(CONCAT(hs ps)) LET r=NUMBER(SUBSET(0 4 h))%rng IF r EQ pk THEN LET w=bt*po ASSERT VERIFYOUT(@INPUT PREVSTATE(9) w @TOKENID FALSE) IF @AMOUNT GT w THEN ASSERT VERIFYOUT(@INPUT+1 ha @AMOUNT-w @TOKENID FALSE) ENDIF ELSE ASSERT VERIFYOUT(@INPUT ha @AMOUNT @TOKENID FALSE) ENDIF RETURN TRUE ENDIF IF ph EQ 2 AND @COINAGE GT to AND SIGNEDBY(hpk) THEN RETURN TRUE ENDIF RETURN FALSE';

var TIMEOUT_BLOCKS=100;
var PRESETS={
  flip:{name:'Coin Flip',range:2,payout:2,labels:['Even','Odd']},
  dice:{name:'Dice',range:6,payout:6,labels:['1','2','3','4','5','6']},
  roulette:{name:'Roulette',range:36,payout:36,labels:null}
};

var SCRIPT_ADDR="",MY_PUBKEY="",MY_HEX_ADDR="",MY_ADDR="",MY_KEYS={};
var DB_READY=false,BETS=[],SELECTED_PRESET="flip",CARD_PICKS={};
var PENDING_TXS={},AUTO_BUSY={},TAKING={},PENDING_CREATE=false;
var PREV_BETS=[],PENDING_RESULTS=[],RESOLVED_BETS=[];

function logActivity(msg,type){
  var el=document.getElementById("activityLog");if(!el)return;
  var t=new Date(),ts=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
  var cls=type==='ok'?'log--ok':type==='warn'?'log--warn':type==='err'?'log--err':'log--info';
  el.innerHTML='<div class="log-entry"><span class="log-time">'+ts+'</span><span class="log-msg '+cls+'">'+msg+'</span></div>'+el.innerHTML;
  while(el.children.length>20)el.removeChild(el.lastChild);
  MDS.log("LOG: "+msg);
}

function saveHistory(){MDS.keypair.set("casino_history",JSON.stringify(RESOLVED_BETS.slice(0,50)))}
function loadHistory(cb){MDS.keypair.get("casino_history",function(r){if(r.status&&r.value){try{RESOLVED_BETS=JSON.parse(r.value)}catch(e){}}if(cb)cb()})}

function esc(s){var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function miniNum(v){return parseFloat(parseFloat(v).toFixed(4))}

function getState(coin,port){
  if(!coin.state)return"";
  for(var i=0;i<coin.state.length;i++){if(coin.state[i].port===port||coin.state[i].port==port)return coin.state[i].data}
  return"";
}

function gameType(range){
  if(range==2)return{name:'Coin Flip',badge:'badge--flip',icon:'\u00A4'};
  if(range==6)return{name:'Dice',badge:'badge--dice',icon:'\u2680'};
  if(range==36)return{name:'Roulette',badge:'badge--roulette',icon:'\u25C9'};
  return{name:'Custom ('+range+')',badge:'badge--flip',icon:'\u2733'};
}

function pickLabel(range,pick){
  if(range==2)return parseInt(pick)===0?'Even':'Odd';
  return''+(parseInt(pick)+1);
}

function isPending(res){
  if(!res)return false;
  if(res.pending===true)return true;
  if(res.status===false&&res.error&&String(res.error).toLowerCase().indexOf("pending")>=0)return true;
  return false;
}

function showPending(el,msg,txid,onComplete){
  if(el){el.className="bet-status bet-status--warn";el.innerText=msg||"Approve in Pending Actions..."}
  if(txid){PENDING_TXS[txid]={callback:onComplete||null,el:el};MDS.log("PENDING: "+txid)}
}
function showErr(el,msg,txid){
  if(el){el.className="bet-status bet-status--err";el.innerText=msg}
  if(txid)MDS.cmd("txndelete id:"+txid);MDS.log("ERROR: "+msg);
}
function showOk(el,msg){if(el){el.className="bet-status bet-status--ok";el.innerText=msg}}

function clearPendingStatus(){
  var els=document.querySelectorAll(".bet-status--warn");
  for(var i=0;i<els.length;i++){
    els[i].className="bet-status bet-status--ok";els[i].innerText="Confirmed!";
    (function(el){setTimeout(function(){el.innerText="";el.className="bet-status"},4000)})(els[i]);
  }
  if(PENDING_CREATE){
    PENDING_CREATE=false;
    var cs=document.getElementById("createStatus");
    if(cs){cs.className="status status--ok";cs.innerText="Bet created and confirmed!";setTimeout(function(){cs.innerText="";cs.className="status"},5000)}
    logActivity("Bet confirmed on-chain!","ok");
  }
}

function resolvePendingResults(){
  if(PENDING_RESULTS.length===0)return;
  MDS.cmd("coins relevant:true tokenid:0x00",function(res){
    if(!res.status||!res.response)return;
    var walletCoins=res.response.filter(function(c){return!c.state||c.state.length===0});
    var toRemove=[];
    PENDING_RESULTS.forEach(function(pr,idx){
      var age=Date.now()-pr.time;if(age<3000)return;
      var alreadyRecorded=RESOLVED_BETS.some(function(rb){return rb.coinid===pr.coinid});
      if(alreadyRecorded){toRemove.push(idx);return}
      var iWon=false,profit;
      if(pr.role==='House'){
        var potAmt=parseFloat(pr.amount);
        var foundPot=walletCoins.some(function(c){return Math.abs(parseFloat(c.amount)-potAmt)<0.001});
        iWon=foundPot;profit=iWon?parseFloat(pr.bet):miniNum(parseFloat(pr.bet)*(pr.payout-1));
      }else{
        var winAmt=miniNum(parseFloat(pr.bet)*pr.payout);
        var foundWin=walletCoins.some(function(c){return Math.abs(parseFloat(c.amount)-winAmt)<0.001});
        iWon=foundWin;profit=iWon?miniNum(winAmt-parseFloat(pr.bet)):parseFloat(pr.bet);
      }
      RESOLVED_BETS.unshift({coinid:pr.coinid,role:pr.role,game:pr.game,range:pr.range,pickLabel:'\u2014',resultLabel:'\u2014',profit:profit,won:iWon,bet:pr.bet,amount:pr.amount,txid:pr.coinid,time:pr.time});
      if(RESOLVED_BETS.length>50)RESOLVED_BETS.pop();
      saveHistory();
      var playerWins=(pr.role==='Player')?iWon:!iWon;
      flashResult(playerWins,pr.role==='House',pr.game,profit,pr.range,-1,-1);
      logActivity((iWon?"WON +":"LOST -")+profit+" Minima \u2014 "+pr.game+" (as "+pr.role+")",iWon?"ok":"err");
      toRemove.push(idx);
    });
    toRemove.sort(function(a,b){return b-a}).forEach(function(i){PENDING_RESULTS.splice(i,1)});
    if(toRemove.length>0)renderHistory();
  });
}

function extractResponse(res){
  if(!res||!res.response)return null;
  var r=res.response;
  if(typeof r==='string')return r;
  if(r.random)return r.random;if(r.hash)return r.hash;if(r.output)return r.output;if(r.value)return r.value;
  var keys=Object.keys(r);
  for(var i=0;i<keys.length;i++){if(typeof r[keys[i]]==='string'&&r[keys[i]].indexOf('0x')===0)return r[keys[i]]}
  return null;
}

function findCoins(tokenid,minAmount,excludeCoinid,callback){
  if(typeof excludeCoinid==='function'){callback=excludeCoinid;excludeCoinid=null}
  MDS.cmd("coins relevant:true sendable:true tokenid:"+tokenid,function(res){
    if(!res.status||!res.response||res.response.length===0){callback(null);return}
    var available=res.response.filter(function(c){return!c.state||c.state.length===0});
    if(excludeCoinid)available=available.filter(function(c){return c.coinid!==excludeCoinid});
    if(available.length===0){callback(null);return}
    var needed=parseFloat(minAmount);
    var sorted=available.slice().sort(function(a,b){return parseFloat(b.amount)-parseFloat(a.amount)});
    if(parseFloat(sorted[0].amount)>=needed){callback({coins:[sorted[0]],total:parseFloat(sorted[0].amount)});return}
    var selected=[],sum=0;
    for(var i=0;i<sorted.length;i++){selected.push(sorted[i]);sum+=parseFloat(sorted[i].amount);if(sum>=needed){callback({coins:selected,total:sum});return}}
    callback(null);
  });
}

function addMultipleInputs(txid,coins,idx,callback){
  if(idx>=coins.length){callback(true);return}
  MDS.cmd("txninput id:"+txid+" coinid:"+coins[idx].coinid,function(res){if(!res.status){callback(false);return}addMultipleInputs(txid,coins,idx+1,callback)});
}

function setStates(txid,states,idx,callback){
  if(idx>=states.length){callback();return}
  MDS.cmd("txnstate id:"+txid+" port:"+states[idx][0]+" value:"+states[idx][1],function(){setStates(txid,states,idx+1,callback)});
}

MDS.init(function(msg){
  if(msg.event==="inited")initApp();
  if(msg.event==="NEWBLOCK"){
    updateBlock(msg);
    if(DB_READY){refreshBets();refreshBalance();autoProcess()}
    if(Object.keys(PENDING_TXS).length>0)checkPendingComplete();
  }
  if(msg.event==="NEWBALANCE"){
    if(DB_READY){refreshBets();refreshBalance();clearPendingStatus();resolvePendingResults()}
  }
});

function initApp(){
  MDS.cmd('newscript script:"'+SCRIPT+'" trackall:true',function(res){
    if(res.status){SCRIPT_ADDR=res.response.address;MDS.log("Contract: "+SCRIPT_ADDR)}
    loadIdentity(function(){finishInit()});
  });
  MDS.cmd("block",function(res){if(res.status)document.getElementById("blockHeight").innerText="#"+res.response.block});
  setupUI();
}

function loadIdentity(callback){
  try{
    var sp=localStorage.getItem("casino_pubkey"),sh=localStorage.getItem("casino_hexaddr"),sm=localStorage.getItem("casino_miniaddr");
    if(sp&&sh){MY_PUBKEY=sp;MY_HEX_ADDR=sh;MY_ADDR=sm||sh;callback();return}
  }catch(e){}
  MDS.keypair.get("casino_pubkey",function(kres){
    if(kres.status&&kres.value&&String(kres.value).length>10){
      MY_PUBKEY=kres.value;
      MDS.keypair.get("casino_hexaddr",function(k2){
        MY_HEX_ADDR=(k2.status&&k2.value)?k2.value:"";
        MDS.keypair.get("casino_miniaddr",function(k3){
          MY_ADDR=(k3.status&&k3.value)?k3.value:MY_HEX_ADDR;
          if(MY_PUBKEY&&MY_HEX_ADDR){callback();return}
          fetchAndStoreIdentity(callback);
        });
      });return;
    }
    fetchAndStoreIdentity(callback);
  });
}

function fetchAndStoreIdentity(callback){
  MDS.cmd("getaddress",function(res){
    if(!res.status){callback();return}
    MY_PUBKEY=res.response.publickey;MY_HEX_ADDR=res.response.address;MY_ADDR=res.response.miniaddress;
    try{localStorage.setItem("casino_pubkey",MY_PUBKEY);localStorage.setItem("casino_hexaddr",MY_HEX_ADDR);localStorage.setItem("casino_miniaddr",MY_ADDR)}catch(e){}
    MDS.keypair.set("casino_pubkey",MY_PUBKEY,function(){MDS.keypair.set("casino_hexaddr",MY_HEX_ADDR,function(){MDS.keypair.set("casino_miniaddr",MY_ADDR,function(){callback()})})});
  });
}

function loadWalletKeys(callback){
  MDS.cmd("keys",function(res){
    try{if(res&&res.status&&res.response){var list=res.response.keys||res.response;if(Array.isArray(list)){for(var i=0;i<list.length;i++){var pk=list[i].publickey||list[i];if(pk&&typeof pk==='string')MY_KEYS[pk]=true}}}}catch(e){}
    if(MY_PUBKEY)MY_KEYS[MY_PUBKEY]=true;
    if(callback)callback();
  });
}

function finishInit(){
  loadWalletKeys(function(){loadHistory(function(){
    DB_READY=true;
    MDS.log("Casino lint v1.3.2 ready. Script="+SCRIPT_ADDR+" Keys="+Object.keys(MY_KEYS).length);
    logActivity("Casino ready \u2014 "+Object.keys(MY_KEYS).length+" keys loaded","info");
    refreshBets();refreshBalance();updateSummary();
  })});
}

function checkPendingComplete(){
  var ids=Object.keys(PENDING_TXS);if(ids.length===0)return;
  MDS.cmd("txnlist",function(res){
    if(!res.status||!res.response)return;
    ids.forEach(function(txid){
      var found=null;
      for(var i=0;i<res.response.length;i++){if(res.response[i].id===txid){found=res.response[i];break}}
      if(!found){delete PENDING_TXS[txid];return}
      var sigs=found.witness&&found.witness.signatures;
      var hasSigs=sigs&&sigs.length>0&&sigs[0]&&sigs[0].signatures&&sigs[0].signatures.length>0;
      if(!hasSigs)return;
      var entry=PENDING_TXS[txid];delete PENDING_TXS[txid];
      MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){
        var rp=Array.isArray(resArr)?resArr[resArr.length-1]:resArr;
        if(rp&&rp.status){MDS.notify("Transaction completed!");if(entry.callback)entry.callback(true);refreshBets();refreshBalance()}
        else{PENDING_TXS[txid]=entry}
      });
    });
  });
}

function refreshBets(){
  if(!SCRIPT_ADDR)return;
  MDS.cmd("coins address:"+SCRIPT_ADDR,function(res){
    var newBets=(res.status&&res.response)?res.response:[];
    if(PREV_BETS.length>0){
      var newIds={};newBets.forEach(function(c){newIds[c.coinid]=true});
      PREV_BETS.forEach(function(old){
        if(newIds[old.coinid])return;
        var phase=parseInt(getState(old,6))||0,amHouse=isMyKey(getState(old,0)),amPlayer=isMyKey(getState(old,8));
        if(!amHouse&&!amPlayer)return;
        if(RESOLVED_BETS.some(function(rb){return rb.coinid===old.coinid}))return;
        if(phase===2&&amHouse&&!amPlayer){
          var range=parseInt(getState(old,3))||2,payout=parseInt(getState(old,4))||2,bet=getState(old,5)||"0";
          PENDING_RESULTS.push({coinid:old.coinid,role:'House',range:range,payout:payout,bet:bet,amount:parseFloat(old.amount),game:gameType(range).name,time:Date.now()});
        }
        if(phase===2&&amPlayer&&!amHouse){
          var rng=parseInt(getState(old,3))||2,bt=getState(old,5)||"0";
          PENDING_RESULTS.push({coinid:old.coinid,role:'Player',range:rng,payout:parseInt(getState(old,4))||2,bet:bt,amount:parseFloat(old.amount),game:gameType(rng).name,time:Date.now()});
        }
      });
    }
    PREV_BETS=newBets.map(function(c){return{coinid:c.coinid,amount:c.amount,state:c.state,age:c.age}});
    BETS=newBets;
    Object.keys(AUTO_BUSY).forEach(function(id){var found=false;BETS.forEach(function(c){if(c.coinid===id)found=true});if(!found)delete AUTO_BUSY[id]});
    Object.keys(TAKING).forEach(function(id){var coin=BETS.find(function(c){return c.coinid===id});if(!coin||parseInt(getState(coin,6))!==0)delete TAKING[id]});
    // Detect create bet confirmed (new phase-0 coin where we're house)
    if(PENDING_CREATE&&PREV_BETS.length>0){
      var prevIds={};PREV_BETS.forEach(function(p){prevIds[p.coinid]=true});
      newBets.forEach(function(c){
        if(!prevIds[c.coinid]&&parseInt(getState(c,6))===0&&isMyKey(getState(c,0))){
          PENDING_CREATE=false;
          var cs=document.getElementById("createStatus");
          if(cs){cs.className="status status--ok";cs.innerText="Bet confirmed on-chain!";setTimeout(function(){cs.innerText="";cs.className="status"},5000)}
          logActivity("Bet confirmed on-chain!","ok");
        }
      });
    }
    renderOpenBets();renderMyBets();
  });
}

// ===== Create Bet =====
function createBet(){
  if(!MY_PUBKEY||!MY_HEX_ADDR){showErr(document.getElementById("createStatus"),"Identity not loaded");return}
  var p=PRESETS[SELECTED_PRESET],rawBet=parseFloat(document.getElementById("betAmountInput").value);
  if(!rawBet||rawBet<=0||isNaN(rawBet)){showErr(document.getElementById("createStatus"),"Enter a valid bet amount");return}
  var bet=parseFloat(rawBet.toFixed(2)),stake=miniNum(bet*(p.payout-1));if(stake<=0)stake=bet;
  var statusEl=document.getElementById("createStatus"),btn=document.getElementById("btnCreate");
  btn.classList.add("btn--disabled");statusEl.className="status";statusEl.innerText="Generating secret...";
  MDS.cmd("random",function(rres){
    var secret=extractResponse(rres);if(!secret){showErr(statusEl,"Random failed");btn.classList.remove("btn--disabled");return}
    MDS.cmd("hash data:"+secret,function(hres){
      var commit=extractResponse(hres);if(!commit){showErr(statusEl,"Hash failed");btn.classList.remove("btn--disabled");return}
      MDS.keypair.set("casino_secret_for_"+commit,secret,function(){
        var stateObj='{"0":"'+MY_PUBKEY+'","1":"'+MY_HEX_ADDR+'","2":"'+commit+'","3":"'+p.range+'","4":"'+p.payout+'","5":"'+bet+'","6":"0","7":"'+TIMEOUT_BLOCKS+'"}';
        var cmd="send amount:"+stake+" address:"+SCRIPT_ADDR+" state:"+stateObj;
        statusEl.innerText="Sending...";
        MDS.cmd(cmd,function(sres){
          btn.classList.remove("btn--disabled");
          if(isPending(sres)){PENDING_CREATE=true;logActivity("Create bet pending \u2014 approve in Pending Actions","warn");showPending(statusEl,"Bet queued \u2014 approve in Pending Actions")}
          else if(sres.status){statusEl.className="status status--ok";statusEl.innerText="Bet created! Waiting for confirmation...";logActivity("Bet created \u2014 "+p.name+" "+bet+" Minima","ok");setTimeout(function(){refreshBets();refreshBalance()},3000)}
          else{showErr(statusEl,sres.error||"Send failed")}
        });
      });
    });
  });
}

  if(btnEl)btnEl.classList.add("btn--disabled");
  var txid="cancel_"+Date.now(),statusEl=document.getElementById(statusId);

  MDS.cmd("txncreate id:"+txid,function(r0){
    if(!r0.status){showErr(statusEl,"txncreate failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");return}
    MDS.cmd("txninput id:"+txid+" coinid:"+coinid,function(r1){
      if(!r1.status){showErr(statusEl,"input failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");return}
      MDS.cmd("txnoutput id:"+txid+" amount:"+coin.amount+" address:"+MY_HEX_ADDR+" storestate:false",function(r2){
        if(!r2.status){showErr(statusEl,"output failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");return}
        MDS.cmd("txnsign id:"+txid+" publickey:"+getState(coin,0),function(rs){
          if(isPending(rs)){showPending(statusEl,"Cancel pending \u2014 approve in Pending Actions",txid,function(ok){if(ok)showOk(statusEl,"Cancelled!");if(btnEl)btnEl.classList.remove("btn--disabled")});return}
          MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){

// ===== Take Bet (phase 0>1) =====
function takeBet(coinid,statusId,btnEl){
  if(TAKING[coinid])return;
  if(!MY_PUBKEY||!MY_HEX_ADDR){showErr(document.getElementById(statusId),"Identity not loaded");return}
  var coin=BETS.find(function(c){return c.coinid===coinid});if(!coin)return;
  TAKING[coinid]=true;if(btnEl)btnEl.classList.add("btn--disabled");
  var bet=getState(coin,5),total=miniNum(parseFloat(coin.amount)+parseFloat(bet)),pick=CARD_PICKS[coinid]||0;
  var txid="take_"+Date.now(),statusEl=document.getElementById(statusId);
  showPending(statusEl,"Generating secret...");
  MDS.cmd("random",function(rres){
    var secret=extractResponse(rres);if(!secret){showErr(statusEl,"Random failed");delete TAKING[coinid];return}
    MDS.cmd("hash data:"+secret,function(hres){
      var commit=extractResponse(hres);if(!commit){showErr(statusEl,"Hash failed");delete TAKING[coinid];return}
      MDS.keypair.set("casino_psecret_for_"+commit,secret,function(){
        findCoins("0x00",parseFloat(bet),coinid,function(result){
          if(!result){showErr(statusEl,"Insufficient Minima (need "+bet+")");delete TAKING[coinid];return}
          statusEl.innerText="Building transaction...";
          MDS.cmd("txncreate id:"+txid,function(r0){
            if(!r0.status){showErr(statusEl,"txncreate failed",txid);delete TAKING[coinid];return}
            MDS.cmd("txninput id:"+txid+" coinid:"+coinid,function(r1){
              if(!r1.status){showErr(statusEl,"contract input failed",txid);delete TAKING[coinid];return}
              addMultipleInputs(txid,result.coins,0,function(ok){
                if(!ok){showErr(statusEl,"fund input failed",txid);delete TAKING[coinid];return}
                MDS.cmd("txnoutput id:"+txid+" amount:"+total+" address:"+SCRIPT_ADDR+" storestate:true",function(r3){
                  if(!r3.status){showErr(statusEl,"output failed",txid);delete TAKING[coinid];return}
                  var change=miniNum(result.total-parseFloat(bet));
                  var afterChange=function(){
                    var states=[[0,getState(coin,0)],[1,getState(coin,1)],[2,getState(coin,2)],[3,getState(coin,3)],[4,getState(coin,4)],[5,getState(coin,5)],[6,"1"],[7,getState(coin,7)],[8,MY_PUBKEY],[9,MY_HEX_ADDR],[10,commit],[11,""+pick]];
                    setStates(txid,states,0,function(){
                      statusEl.innerText="Signing...";
                      MDS.cmd("txnsign id:"+txid+" publickey:auto",function(rs){
                        if(isPending(rs)){logActivity("Take bet pending \u2014 approve in Pending Actions","warn");showPending(statusEl,"Approve in Pending Actions to take this bet",txid,function(ok2){if(ok2){logActivity("Bet taken! Waiting for house to reveal...","ok");MDS.notify("Bet taken!");switchTab("mybets");refreshBets();refreshBalance()}else{delete TAKING[coinid];renderOpenBets()}});return}
                        MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){
                          var rp=Array.isArray(resArr)?resArr[resArr.length-1]:resArr;
                          if(rp&&rp.status){MDS.notify("Bet taken!");switchTab("mybets");renderOpenBets();setTimeout(function(){refreshBets();refreshBalance()},2000)}
                          else{delete TAKING[coinid];showErr(statusEl,"Post failed: "+(rp?rp.error:""),txid)}
                        });
                      });
                    });
                  };
                  if(change>0.000001){MDS.cmd("txnoutput id:"+txid+" amount:"+change+" address:"+MY_HEX_ADDR+" storestate:false",function(rc){if(!rc.status){showErr(statusEl,"change output failed",txid);delete TAKING[coinid];return}afterChange()})}
                  else{afterChange()}
                });
              });
            });
          });
        });
      });
    });
  });
}

// ===== House Auto-Reveal (phase 1>2) =====
function doAutoReveal(coin){
  var coinid=coin.coinid,betCommit=getState(coin,2);
  MDS.keypair.get("casino_secret_for_"+betCommit,function(sres){
    if(!sres.value){delete AUTO_BUSY[coinid];return}
    var housesecret=sres.value,txid="autoreveal_"+Date.now();
    MDS.cmd("txncreate id:"+txid,function(r0){
      if(!r0.status){delete AUTO_BUSY[coinid];return}
      MDS.cmd("txninput id:"+txid+" coinid:"+coinid,function(r1){
        if(!r1.status){MDS.cmd("txndelete id:"+txid);delete AUTO_BUSY[coinid];return}
        MDS.cmd("txnoutput id:"+txid+" amount:"+coin.amount+" address:"+SCRIPT_ADDR+" storestate:true",function(r2){
          if(!r2.status){MDS.cmd("txndelete id:"+txid);delete AUTO_BUSY[coinid];return}
          var states=[[0,getState(coin,0)],[1,getState(coin,1)],[2,getState(coin,2)],[3,getState(coin,3)],[4,getState(coin,4)],[5,getState(coin,5)],[6,"2"],[7,getState(coin,7)],[8,getState(coin,8)],[9,getState(coin,9)],[10,getState(coin,10)],[11,getState(coin,11)],[12,housesecret]];
          setStates(txid,states,0,function(){
            MDS.cmd("txnsign id:"+txid+" publickey:"+getState(coin,0),function(rs){
              if(isPending(rs)){var safeCoinId=coinid.replace(/[^a-fA-F0-9x]/g,'');var statusEl=document.getElementById('my_status_'+safeCoinId.substring(0,16));logActivity("House reveal pending \u2014 approve in Pending Actions","warn");showPending(statusEl,"Auto-reveal pending \u2014 approve in Pending Actions",txid,function(ok){delete AUTO_BUSY[coinid];if(ok)logActivity("House secret revealed \u2014 waiting for player resolve","ok");refreshBets()});return}
              if(!rs.status){MDS.cmd("txndelete id:"+txid);delete AUTO_BUSY[coinid];return}
              MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){
                var rp=Array.isArray(resArr)?resArr[resArr.length-1]:resArr;
                if(rp&&rp.status){MDS.notify("Secret revealed!");logActivity("House secret revealed \u2014 waiting for player","ok")}
                else{MDS.cmd("txndelete id:"+txid);logActivity("Auto-reveal failed","err")}
                delete AUTO_BUSY[coinid];refreshBets();refreshBalance();
              });
            });
          });
        });
      });
    });
  });
}

// ===== Player Resolve (phase 2>payout) =====
function doPlayerResolve(coinid,statusId,btnEl){
  var coin=BETS.find(function(c){return c.coinid===coinid});if(!coin)return;
  if(btnEl)btnEl.classList.add("btn--disabled");
  var statusEl=statusId?document.getElementById(statusId):null;
  var playerCommit=getState(coin,10);
  MDS.keypair.get("casino_psecret_for_"+playerCommit,function(sres){
    if(!sres.value){if(statusEl)showErr(statusEl,"Player secret not found");if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
    var playersecret=sres.value,housesecret=getState(coin,12);
    var bet=getState(coin,5),payout=parseInt(getState(coin,4)),range=parseInt(getState(coin,3)),playerpick=parseInt(getState(coin,11));
    var winnings=miniNum(parseFloat(bet)*payout),totalAmt=parseFloat(coin.amount);
    var houseaddr=getState(coin,1),playeraddr=getState(coin,9);
    var combined=housesecret+playersecret.substring(2);
    MDS.cmd("hash data:"+combined,function(hres){
      var hash=extractResponse(hres);if(!hash){if(statusEl)showErr(statusEl,"Hash failed");if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
      var num=parseInt(hash.substring(2,10),16),result=num%range,playerWins=(result===playerpick);
      if(statusEl){statusEl.className="bet-status bet-status--warn";statusEl.innerText=playerWins?"You won! Processing...":"House won. Processing..."}
      var txid="resolve_"+Date.now();
      MDS.cmd("txncreate id:"+txid,function(r0){
        if(!r0.status){if(statusEl)showErr(statusEl,"txncreate failed");if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
        MDS.cmd("txninput id:"+txid+" coinid:"+coinid,function(r1){
          if(!r1.status){if(statusEl)showErr(statusEl,"input failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
          var afterOutputs=function(){
            MDS.cmd("txnstate id:"+txid+" port:13 value:"+playersecret,function(){
              MDS.cmd("txnsign id:"+txid+" publickey:"+getState(coin,8),function(rs){
                if(isPending(rs)){
  logActivity("Resolve pending \u2014 approve in Pending Actions","warn");
  if(statusEl)showPending(statusEl,"Resolve pending \u2014 approve in Pending Actions",txid,function(ok){
    if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];
    if(ok){
      var isHouse=isMyKey(getState(coin,0)),gt=gameType(range);
      var iWon=(playerWins&&!isHouse)||(!playerWins&&isHouse);
      var profit;if(iWon){profit=isHouse?parseFloat(bet):miniNum(winnings-parseFloat(bet))}else{profit=isHouse?miniNum(parseFloat(bet)*(payout-1)):parseFloat(bet)}
      RESOLVED_BETS.unshift({coinid:coinid,role:isHouse?'House':'Player',game:gt.name,range:range,pickLabel:pickLabel(range,playerpick),resultLabel:pickLabel(range,result),playerWins:playerWins,winnings:winnings,profit:profit,won:iWon,bet:bet,amount:totalAmt,txid:coinid,time:Date.now()});
      if(RESOLVED_BETS.length>50)RESOLVED_BETS.pop();saveHistory();
      flashResult(playerWins,isHouse,gt.name,profit,range,playerpick,result);
      logActivity((iWon?"WON +":"LOST -")+profit+" Minima \u2014 "+gt.name,iWon?"ok":"err");
      MDS.notify(iWon?"You won +"+profit+" Minima!":"You lost -"+profit+" Minima.");
      refreshBets();refreshBalance();
    }
  });return;
}
                if(!rs.status){if(statusEl)showErr(statusEl,"Sign failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
                MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){
                  var rp=Array.isArray(resArr)?resArr[resArr.length-1]:resArr;
                  if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];
                  if(rp&&rp.status){
                    var isHouse=isMyKey(getState(coin,0)),gt=gameType(range);
                    var postTxid=(rp.response&&rp.response.txpowid)?rp.response.txpowid:coinid;
                    var iWon=(playerWins&&!isHouse)||(!playerWins&&isHouse);
                    var profit;
                    if(iWon){profit=isHouse?parseFloat(bet):miniNum(winnings-parseFloat(bet))}
                    else{profit=isHouse?miniNum(parseFloat(bet)*(payout-1)):parseFloat(bet)}
                    RESOLVED_BETS.unshift({coinid:coinid,role:isHouse?'House':'Player',game:gt.name,range:range,pickLabel:pickLabel(range,playerpick),resultLabel:pickLabel(range,result),playerWins:playerWins,winnings:winnings,profit:profit,won:iWon,bet:bet,amount:totalAmt,txid:postTxid,time:Date.now()});
                    if(RESOLVED_BETS.length>50)RESOLVED_BETS.pop();saveHistory();
                    flashResult(playerWins,isHouse,gt.name,profit,range,playerpick,result);
                    logActivity((iWon?"WON +":"LOST -")+profit+" Minima \u2014 "+gt.name,iWon?"ok":"err");
                    MDS.notify(iWon?"You won +"+profit+" Minima!":"You lost -"+profit+" Minima.");
                    refreshBets();refreshBalance();
                  }else{if(statusEl)showErr(statusEl,"Resolve failed: "+(rp?rp.error:""),txid)}
                });
              });
            });
          };
          if(playerWins){
            MDS.cmd("txnoutput id:"+txid+" amount:"+winnings+" address:"+playeraddr+" storestate:false",function(ro1){
              if(!ro1.status){if(statusEl)showErr(statusEl,"payout output failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
              var remainder=miniNum(totalAmt-winnings);
              if(remainder>0.00001){MDS.cmd("txnoutput id:"+txid+" amount:"+remainder+" address:"+houseaddr+" storestate:false",function(ro2){if(!ro2.status){if(statusEl)showErr(statusEl,"remainder failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}afterOutputs()})}
              else{afterOutputs()}
            });
          }else{
            MDS.cmd("txnoutput id:"+txid+" amount:"+totalAmt+" address:"+houseaddr+" storestate:false",function(ro1){
              if(!ro1.status){if(statusEl)showErr(statusEl,"payout output failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");delete AUTO_BUSY[coinid];return}
              afterOutputs();
            });
          }
        });
      });
    });
  });
}

// ===== Claim Timeout =====
function claimTimeout(coinid,statusId,btnEl){
  var coin=BETS.find(function(c){return c.coinid===coinid});if(!coin)return;
  if(btnEl)btnEl.classList.add("btn--disabled");
  var txid="timeout_"+Date.now(),statusEl=document.getElementById(statusId);
  showPending(statusEl,"Claiming timeout...");
  MDS.cmd("txncreate id:"+txid,function(r0){
    if(!r0.status){showErr(statusEl,"txncreate failed");if(btnEl)btnEl.classList.remove("btn--disabled");return}
    MDS.cmd("txninput id:"+txid+" coinid:"+coinid,function(r1){
      if(!r1.status){showErr(statusEl,"input failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");return}
      MDS.cmd("txnoutput id:"+txid+" amount:"+coin.amount+" address:"+MY_HEX_ADDR+" storestate:false",function(r2){
        if(!r2.status){showErr(statusEl,"output failed",txid);if(btnEl)btnEl.classList.remove("btn--disabled");return}
        MDS.cmd("txnsign id:"+txid+" publickey:auto",function(rs){
          if(isPending(rs)){showPending(statusEl,"Timeout pending \u2014 approve",txid);return}
          MDS.cmd("txnbasics id:"+txid+";txnpost id:"+txid,function(resArr){
            var rp=Array.isArray(resArr)?resArr[resArr.length-1]:resArr;
            if(btnEl)btnEl.classList.remove("btn--disabled");
            if(rp&&rp.status){showOk(statusEl,"Timeout claimed! Funds returned.");refreshBets();refreshBalance()}
            else{showErr(statusEl,"Claim failed: "+(rp?rp.error:""),txid)}
          });
        });
      });
    });
  });
}

// ===== History =====
function renderHistory(){
  var el=document.getElementById("historyList");
  var tabEl=document.querySelector('[data-view="history"]');
  if(tabEl)tabEl.innerText="History"+(RESOLVED_BETS.length?" ("+RESOLVED_BETS.length+")":"");
  if(RESOLVED_BETS.length===0){el.innerHTML='<div class="empty">No completed bets yet</div>';return}
  var html="";
  RESOLVED_BETS.forEach(function(rb){
    var won=rb.won!==undefined?rb.won:(rb.playerWins?(rb.role==='Player'):(rb.role==='House'));
    var profit=rb.profit!==undefined?rb.profit:(won?rb.winnings:rb.bet);
    var color=won?'var(--green)':'var(--red)',sign=won?'+':'-';
    html+='<div class="hist-row">';
    html+='<span style="font-size:16px">'+gameType(rb.range).icon+'</span>';
    html+='<span style="flex:1;font-size:12px;font-weight:600">'+esc(rb.game)+' <span style="color:var(--text-dim);font-weight:400">as '+esc(rb.role)+'</span>';
    if(rb.pickLabel&&rb.pickLabel!=='\u2014')html+='<br><span style="font-size:11px;color:var(--text-dim);font-weight:400">Picked: '+esc(rb.pickLabel)+' \u2192 Result: '+esc(rb.resultLabel)+'</span>';
    html+='</span>';
    html+='<span style="font-family:var(--mono);font-size:13px;font-weight:800;color:'+color+'">'+sign+esc(String(profit))+'</span>';
    html+='</div>';
  });
  el.innerHTML='<div class="card" style="padding:0;overflow:hidden">'+html+'</div>';
}

// ===== Result Modal =====
function flashResult(playerWins,isHouse,game,amount,range,pickIdx,resultIdx){
  var won=(playerWins&&!isHouse)||(!playerWins&&isHouse);
  var overlay=document.getElementById("resultFlash"),inner=document.getElementById("resultFlashInner");
  var color=won?'var(--green)':'var(--red)';
  var icon=won?'\u2714':'\u2718';
  var detail='';
  if(pickIdx>=0&&resultIdx>=0){
    if(range==2)detail='Result: <b>'+(resultIdx===0?'Even':'Odd')+'</b> \u2014 You picked: <b>'+(pickIdx===0?'Even':'Odd')+'</b>';
    else if(range==6)detail='Rolled: <b>'+(resultIdx+1)+'</b> \u2014 You picked: <b>'+(pickIdx+1)+'</b>';
    else if(range==36)detail='Ball landed on: <b>'+(resultIdx+1)+'</b> \u2014 You picked: <b>'+(pickIdx+1)+'</b>';
  }
  inner.innerHTML='<div class="result-icon">'+(won?'\uD83C\uDF89':'\uD83D\uDCA8')+'</div>'+
    '<div class="result-title" style="color:'+color+'">'+(won?'You Win!':'You Lose')+'</div>'+
    (detail?'<div class="result-detail">'+detail+'</div>':'')+
    '<div class="result-amount" style="color:'+color+'">'+(won?'+':'-')+amount+' Minima</div>'+
    '<div class="result-detail">'+game+'</div>'+
    '<button class="result-dismiss" onclick="document.getElementById(\'resultFlash\').style.display=\'none\'">Dismiss</button>';
  overlay.style.display="flex";
  overlay.onclick=function(e){if(e.target===overlay)overlay.style.display="none"};
}

function switchTab(viewName){
  document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("tab--active")});
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("view--active")});
  var tab=document.querySelector('[data-view="'+viewName+'"]');if(tab)tab.classList.add("tab--active");
  var view=document.getElementById("view-"+viewName);if(view)view.classList.add("view--active");
}

function autoProcess(){
  if(!DB_READY||BETS.length===0)return;
  for(var i=0;i<BETS.length;i++){
    var coin=BETS[i],phase=parseInt(getState(coin,6))||0,coinid=coin.coinid;
    if(AUTO_BUSY[coinid])continue;
    if(phase===1&&isMyKey(getState(coin,0))){AUTO_BUSY[coinid]=true;doAutoReveal(coin)}
    if(phase===2&&isMyKey(getState(coin,8))){AUTO_BUSY[coinid]=true;var safeCoinId=coinid.replace(/[^a-fA-F0-9x]/g,'');doPlayerResolve(coinid,'my_status_'+safeCoinId.substring(0,16))}
  }
}
